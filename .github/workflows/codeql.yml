name: "CodeQL"

# CodeQL semantic analysis for PHP. Free for public repos. Catches SQL
# injection, XSS, path traversal, unsafe deserialization, and other
# common security bug classes. Results show up under the repo's
# Security > Code scanning tab.

on:
  pull_request:
    branches: [4.x, 'feature/**']
    paths:
      - '**.php'
      - '**.module'
      - '**.install'
      - '.github/workflows/codeql.yml'
  push:
    branches: [4.x]
  schedule:
    # Weekly full scan even if no code changed, catches new CodeQL queries
    # shipped by GitHub against the existing codebase. Monday 06:00 UTC.
    - cron: '0 6 * * 1'

# CodeQL needs write access to security-events to upload SARIF results.
# Everything else stays read-only.
permissions:
  contents: read
  security-events: write
  # actions: read is required for private repos; harmless here.
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze PHP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['php']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Initializes the CodeQL tools and the language-specific
      # queries database. We pick the "security-and-quality" suite
      # over "security-extended" to also catch dead code and
      # maintainability issues alongside vulnerabilities.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # PHP is interpreted, no build step is needed. autobuild is the
      # documented no-op for interpreted languages.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
