name: Tests and delivery (disabled in fork)

# This workflow is inherited from upstream farmOS (farmOS/farmOS).
# In the AgriforestryOS fork it is intentionally disabled.
#
# Why:
#
# 1. The build job pulls farmos/farmos 4.x-dev, which currently pins
#    drupal/core 11.3.8. That version is blocked by composer security
#    advisory SA-CORE-2026-004; until upstream bumps the pin the build
#    cannot succeed on any farmOS-derived fork. The AgriforestryOS
#    policy is not to contribute fixes back upstream
#    (see memory/project_agriforestryos.md).
#
# 2. The release / publish / announce jobs are guarded by
#    `github.repository == 'farmOS/farmOS'` and would never fire from
#    this fork anyway.
#
# 3. Our own CI covers the code we actually author:
#      - .github/workflows/ci-farm-syntropic.yml    (fast static checks)
#      - .github/workflows/phpstan-farm-syntropic.yml
#      - .github/workflows/smoke-farm-syntropic.yml (end-to-end install)
#
# The previous 467-line workflow content is recoverable from git
# history (blob 4c88ad3abeae8f0e8f18778b26451a91f67e982a, parent of
# this commit).

on:
  workflow_dispatch:

jobs:
  noop:
    name: No-op (workflow disabled in fork)
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "This workflow is intentionally disabled in the AgriforestryOS fork."
          echo "See the comment at the top of .github/workflows/deliver.yml for the rationale."
          echo "Our own workflows (ci-farm-syntropic, phpstan-farm-syntropic, smoke-farm-syntropic) cover the code we author."
