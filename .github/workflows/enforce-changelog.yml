name: "Pull Request Changelog Enforcement Workflow"
on:
  pull_request:
    # The specific activity types are listed here to include "labeled" and
    # "unlabeled" since the enforcer allows for skipping enforcement of the
    # changelog being edited via the "skipLabels" property
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# Default to read-only token; this job only reads the diff against the base ref.
permissions:
  contents: read

jobs:
  # Enforces the update of a changelog file on every pull request
  changelog:
    runs-on: ubuntu-latest
    steps:
      # The checkout step is required since this action uses local git commands
      # to enforce the changelog
      - uses: actions/checkout@v6
      # Third-party action pinned to an immutable commit SHA (v3.7.0).
      # Dependabot will open PRs to bump this when new versions ship.
      - uses: dangoslen/changelog-enforcer@8b5e9dc3121363bb7c0115f8533404d92af382de # v3.7.0
