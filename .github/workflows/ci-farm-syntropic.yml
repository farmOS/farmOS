name: farm_syntropic CI (fast)

# Fast static checks that run on every PR.
# Heavier integration/smoke tests live in smoke-farm-syntropic.yml.
#
# Linter scoping policy:
# This repo is a fork of farmOS/farmOS, and per project policy we do not
# contribute to upstream. Linters here are scoped to paths we authored
# (modules/farm_syntropic, docs/workflows, and the .github/workflows files
# we own). Findings in inherited upstream files are not our hygiene problem
# and we do not have a path to fix them.

on:
  pull_request:
    branches: [4.x, 'feature/**']
  push:
    branches: [4.x]

permissions:
  contents: read

concurrency:
  group: ci-farm-syntropic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint (scoped to workflows we own)
        # The official actionlint Docker image (immutable :1.7.7 tag).
        # We pass an explicit file list rather than letting actionlint
        # discover .github/workflows/*.yml, because the deliver.yml and
        # netlify-build-docs.yml workflows are inherited from upstream
        # farmOS and we are not contributing fixes upstream.
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7 -color \
              .github/workflows/ci-farm-syntropic.yml \
              .github/workflows/smoke-farm-syntropic.yml \
              .github/workflows/phpstan-farm-syntropic.yml \
              .github/workflows/enforce-changelog.yml

  yaml-lint:
    name: YAML lint (config + workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --user yamllint==1.35.1
      - name: Lint farm_syntropic config files
        # Drupal config YAML allows long lines and unquoted strings, so we
        # use the "relaxed" preset with line-length relaxed further.
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable}}" \
            modules/farm_syntropic/

  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@2e947f1f6932d141d076ca441d0e1e881775e95b # v2.31.1
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - name: Lint all PHP files in the module
        # `php -l` returns non-zero on any parse error and prints the line.
        run: |
          set -e
          find modules/farm_syntropic -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' \) -print0 \
            | xargs -0 -n1 php -l

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan diff range on PRs and to
          # detect secrets in older commits (a secret in git history is
          # still a leak even after the file is deleted).
          fetch-depth: 0
      - name: Run gitleaks (with fork-scoped allowlist)
        # Pinned to v8.18.4 immutable tag from the official image.
        # The .gitleaks.toml at the repo root tells gitleaks to skip
        # upstream documentation files that contain example tokens.
        run: |
          docker run --rm \
            -v "${PWD}:/path" \
            zricethezav/gitleaks:v8.18.4 \
            detect \
              --source="/path" \
              --config="/path/.gitleaks.toml" \
              --no-banner \
              --verbose
