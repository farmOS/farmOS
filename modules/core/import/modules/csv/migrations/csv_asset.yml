id: csv_asset
label: farmOS Asset CSV Importers
migration_group: farm_import_csv
source:
  plugin: csv_file
destination:
  plugin: entity:asset
process:

  # Asset name.
  name: name

  # Asset notes with default format.
  notes/0/value: notes
  notes/0/format:
    plugin: default_value
    default_value: default

  # Flags.
  flag:
    - plugin: skip_on_empty
      method: process
      source: flags
    - plugin: explode
      delimiter: ,
    - plugin: callback
      callable: trim

  # Asset category.
  category:
    - plugin: skip_on_empty
      method: process
      source: categories
    - plugin: explode
      delimiter: ,
    - plugin: term_lookup
      bundle: asset_category

  # Parent asset reference lookup.
  parent:
    - plugin: skip_on_empty
      method: process
      source: parents
    - plugin: explode
      delimiter: ,
    - plugin: asset_lookup

  # Is location/fixed booleans.
  is_location:
    plugin: boolean
    source: is location
  is_fixed:
    plugin: boolean
    source: is fixed

  # Intrinsic geometry.
  intrinsic_geometry: intrinsic geometry

  # Archived
  archived:
    plugin: boolean
    source: archived

# Describe the base columns.
third_party_settings:
  farm_import_csv:
    columns:
      - name: name
        description: Name of the asset. Required.
      - name: parents
        description: Parents of the asset. Accepts asset names, ID tags, UUIDs, and IDs. Multiple assets can be separated by commas with the whole cell wrapped in quotes.
      - name: notes
        description: Notes about the asset.
      - name: categories
        description: Asset category taxonomy terms. Multiple terms can be separated by commas with the whole cell wrapped in quotes.
      - name: flags
        description: Flags for sorting and filtering. Multiple flags can be separated by commas with the whole cell wrapped in quotes.
      - name: is location
        description: Whether this asset is a location. Accepts most boolean values. Leave this blank to use the default for this asset type.
      - name: is fixed
        description: Whether this asset has a fixed location. Accepts most boolean values. Leave this blank to use the default for this asset type.
      - name: intrinsic geometry
        description: The intrinsic geometry of the asset in WKT format. This is only used if the asset has a fixed location.
      - name: archived
        description: Whether the asset is archived. Accepts most boolean values.

deriver: \Drupal\farm_import_csv\Plugin\Derivative\CsvImportMigrationAsset
