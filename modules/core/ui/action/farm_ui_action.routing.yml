farm.action.asset:
  path: '/asset/{entity}/action/{action}'
  defaults:
    _controller: \Drupal\farm_ui_action\Controller\EntityActionController::execute
  requirements:
    _custom_access: \Drupal\farm_ui_action\Controller\EntityActionController::access
    _module_dependencies: asset
    entity: \d+
  options:
    parameters:
      entity:
        type: entity:asset
      action:
        type: entity:action

